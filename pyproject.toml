[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-ssm"
version = "0.1.0"
description = "Physics-encoded state space operators for lattice mechanics"
requires-python = ">=3.11"
dependencies = ["torch==2.5.1", "numpy==2.1.3", "pyyaml==6.0.2", "h5py==3.12.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0"]

[project.scripts]
pe-ssm-train = "pe_ssm.commands.train:main"
pe-ssm-evaluate = "pe_ssm.commands.evaluate:main"
pe-ssm-infer = "pe_ssm.commands.infer:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pe_ssm"]
mypy_path = "code"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
